# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Set these variables to have the correct exercise name and module title.
env:
  EXERCISE_NAME: "ai-training-mcp"
  MODULE_TITLE: "MCP Tools"

# Define how the workflow is triggered.
on:
  push:
    paths:
      - 'docs/MigrationPlan.md'
      - 'docs/MigrationPlanWithContext7.md'
      - 'e2e/**'
      - 'test/**'
      - 'src/**'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  check_initial_commit:
    name: Check if initial commit
    runs-on: ubuntu-latest
    outputs:
      is-initial: ${{ steps.check.outputs.is-initial }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit count
        id: check
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "is-initial=$([[ $commit_count -eq 1 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  find_exercise:
    name: Find Exercise Issue
    needs: check_initial_commit
    if: needs.check_initial_commit.outputs.is-initial == 'false'
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.8.1

  post_checking_message:
    name: Post checking work message
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post checking work message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/markdown-templates/exercise/checking-work.md

  validate_exercise:
    name: Validate Exercise Completion
    runs-on: ubuntu-latest
    needs: post_checking_message
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration plan files exist
        run: |
          if [ ! -f "docs/MigrationPlan.md" ]; then
            echo "❌ docs/MigrationPlan.md not found"
            exit 1
          fi
          echo "✅ docs/MigrationPlan.md exists"

          if [ ! -f "docs/MigrationPlanWithContext7.md" ]; then
            echo "❌ docs/MigrationPlanWithContext7.md not found"
            exit 1
          fi
          echo "✅ docs/MigrationPlanWithContext7.md exists"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install playwright dependencies
        run: npx playwright install

      - name: Build project
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

  post_final_content:
    name: Post final content
    needs: [find_exercise, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    # Use the correct PowerAutomate URL in 'Mark Lab as Complete' step.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable current workflow
        run: |
          gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark Lab as Complete
        run: |
          set -e
          GIT_EMAIL=$(git log -1 --pretty=format:'%ae')
          GIT_NAME=$(git log -1 --pretty=format:'%an')
          curl -X POST "https://default4b4e036df94b42098f076860b36413.66.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5242275606d94fb1b2aee65c76e9ee10/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=aY8VDkUCoRI4nm9OGcPviIdZJnEbvNEqvjq7wOL7j5w" \
          -H "Content-Type: application/json" \
          -d "{
            \"GitHubUsername\": \"${{ github.actor }}\",
            \"Name\": \"${GIT_NAME}\",
            \"Exercise\": \"${{ env.EXERCISE_NAME }}\",
            \"Email\": \"${GIT_EMAIL}\"
          }"

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build final comment from local template
        id: build-final-comment
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/exercise-finished.md
          template-vars: |
            title: ${{ env.MODULE_TITLE }}
            login: ${{ github.actor }}
            repo_full_name: ${{ github.repository }}

      - name: Build final README from local template
        id: build-final-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/readme/exercise-finished.md
          template-vars: |
            login: ${{ github.actor }}
            issue_url: ${{ env.ISSUE_URL }}

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with final message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-final-comment.outputs.updated-text }}
          edit-mode: replace

      - name: Close issue
        run: |
          gh issue close ${{ env.ISSUE_NUMBER }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        env:
          README_TEXT: ${{ steps.build-final-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Congratulations!🎉"
          default_author: github_actions

  post_mistake_message:
    name: Post mistake message
    needs: [find_exercise, validate_exercise]
    if: always() && needs.validate_exercise.result == 'failure'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    # Set the feedback message to a proper one in the 'Build mistake message from local template' step.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build mistake message from local template
        id: build-mistake-message
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/step-mistake.md
          template-vars: |
            feedback_message: The exercise validation failed. Please ensure that all tests pass and that both migration plan files exist (`docs/MigrationPlan.md` and `docs/MigrationPlanWithContext7.md`). Then try again.

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment with mistake message
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          body: ${{ steps.build-mistake-message.outputs.updated-text }}
          edit-mode: replace
